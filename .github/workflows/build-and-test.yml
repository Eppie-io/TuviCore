# This workflow will build and test the project

name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - release/**
  pull_request:
    branches:
      - main
      - develop
      - release/**

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      project: Sources/Tuvi.Core.slnx
      test-project: Sources/Tuvi.Core.slnx
 
    steps:
    - name: Support longpaths
      if: ${{ matrix.os == 'windows-latest'}}
      run: git config --system core.longpaths true

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: recursive

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.x

    # Build the application 
    - name: Build
      run: dotnet build ${{ env.project }} --configuration ${{ env.configuration }}
      env:
        configuration: ${{ matrix.configuration }}

    ## Execute all unit tests in the solution
    - name: Execute unit tests
      if: ${{ matrix.os != 'macos-latest'}}
      run: dotnet test ${{ env.test-project }} --configuration ${{ env.configuration }}
      env:
        configuration: ${{ matrix.configuration }}
